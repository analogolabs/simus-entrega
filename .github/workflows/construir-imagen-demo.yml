name: Construir imagen SIMUS demo
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az acr build --registry <registro-de-contenedores> --image simus:${{ github.sha }} --image simus:demo --file Dockerfile --no-logs .
