  <!-- Icons -->
  <!--
    LA MARCA DEL PNMC, NO LA DE ANGULAR. Hasta este `favicon.ico` era
    el que deja `ng new`: el logotipo de Angular en rosa y morado. No es un descuido de este
    desarrollo —el de el diseño aprobado del portal y el de un desarrollo anterior llevan el mismo— pero es lo primero que se ve de
    un sitio, en la pestaña y en los marcadores.

    LOS DOS FICHEROS SE GENERAN, NO SE DIBUJAN A MANO: `tools/genera-favicon.py` los saca de
    `public/Icono PNMC Negro.png`, la marca de 2000x2000 que ya estaba en el proyecto, teñida con
    el morado del tema. El script explica por qué engrosa las crestas antes de reducir; en corto:
    la tinta cubre el 15 % del lienzo y a 16 px el promedio se la come.

    Si cambia la marca, se sustituye ese PNG y se vuelve a ejecutar el script.
  -->
  <!--
    EL PNG VA PRIMERO Y EL `.ICO` QUEDA DE RESPALDO, y el orden importa por una razón concreta: un
    navegador guarda el icono POR SU URL y lo conserva con muchísima insistencia. Cambiar el
    contenido de `/favicon.ico` deja a quien ya visitó el sitio viendo el anterior durante días;
    estas direcciones son nuevas, así que entran a la primera. Los navegadores modernos además
    prefieren el PNG declarado con su medida.
  -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icono-pnmc-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icono-pnmc-192.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <!-- Fuentes ALOJADAS EN EL PROPIO SITIO (optimización, 20 nov 2026): `src/fuentes.css` declara Nunito Sans, Oswald y
       Outfit como fuentes variables (subconjuntos latin y latin-ext, `font-display: swap`) servidas desde `/fonts/`.
       Antes eran tres familias de Google con 13 pesos: una resolución DNS, dos conexiones TLS y dos viajes en
       cadena (CSS y luego fuentes) antes de pintar texto, además de enviar la IP de cada visitante a un tercero.
       Se precargan las dos que pintan el texto del primer pliegue. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/nunito-sans-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin.woff2" crossorigin>
  <!-- ARMAZÓN DE ARRANQUE (decisión 117): lo que se ve antes de que Angular y el paquete de la ruta lleguen.
       Vive DENTRO de <app-root>, así que Angular lo reemplaza al arrancar sin dejar rastro. Sin JS. -->
  <style>
    .arranque-barra { height: 72px; background: rgb(76 44 84); }
    .arranque-pagina { max-width: 96rem; margin: 0 auto; padding: 2.5rem 1.5rem; display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr)); }
    .arranque-bloque { min-height: 21rem; border: 1px solid rgb(231 234 240); border-radius: 1rem; background: rgb(241 242 246); animation: arranque-latido 1.2s ease-in-out infinite; }
    @keyframes arranque-latido { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .arranque-bloque { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="arranque-barra" aria-hidden="true"></div>
    <div class="arranque-pagina" aria-busy="true" role="status" aria-label="Cargando SIMUS">
      <div class="arranque-bloque"></div><div class="arranque-bloque"></div><div class="arranque-bloque"></div>
    </div>
  </app-root>
</body>
