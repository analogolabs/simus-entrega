@if (shouldShow()) {
  <button type="button"
    class="fixed bottom-6 right-20 sm:right-24 z-(--z-flotante) flex items-center bg-verde text-morado p-2 rounded-full shadow-2xl hover:scale-105 active:scale-95 transition-[scale,box-shadow,background-color] duration-200 border border-white/20 group max-w-[54px] hover:max-w-[280px] overflow-hidden whitespace-nowrap focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-morado focus-visible:ring-offset-2 cursor-pointer"
    (click)="navigateToStrategy()"
    aria-label="Abrir estrategia Celebra la música"
  >
    <div class="w-10 h-10 bg-morado text-verde rounded-full flex items-center justify-center shrink-0">
      <svg iconoFijo="party-popper" [size]="18"></svg>
    </div>
    <span class="font-alternate text-xs font-bold px-4 opacity-0 group-hover:opacity-100 transition-opacity duration-200">
      Celebra la música
    </span>
  </button>
}
