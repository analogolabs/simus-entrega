<!--
  «Registrar una organización» (#40). Todo campo lleva su `<label for>` y su `id`; los errores se
  enlazan con `aria-describedby` y el primero recibe el foco.
-->
<section class="max-w-3xl space-y-6" aria-labelledby="nueva-org-titulo">
  <header class="space-y-1">
    <h1 id="nueva-org-titulo">Registrar una organización</h1>
    <p class="max-w-2xl text-cuerpo leading-relaxed text-prosa">
      Tu cuenta quedará como administradora de la organización nueva. Puedes administrar varias y
      abrir cada una en su propio panel desde «Mis organizaciones».
    </p>
  </header>

  @if (error()) { <p role="alert" class="rounded-xl border border-red-200 bg-red-50 p-3 text-sm text-red-800">{{ error() }}</p> }

  <form class="space-y-4" novalidate (submit)="$event.preventDefault(); registrar()">
    <label for="nueva-org-name" class="block text-sm font-bold text-slate-900">
      Nombre de la organización <span class="text-verde-texto" aria-hidden="true">*</span>
      <input id="nueva-org-name" name="name" type="text" required maxlength="240" autocomplete="organization"
             [(ngModel)]="formulario.name" (ngModelChange)="limpiar('name')"
             [attr.aria-invalid]="errores()['name'] ? 'true' : null"
             [attr.aria-describedby]="errores()['name'] ? 'nueva-org-name-error' : null"
             class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-3 font-normal text-slate-900 focus:border-verde-medio focus:outline-none focus-visible:ring-2 focus-visible:ring-verde-medio">
      @if (errores()['name']) { <span id="nueva-org-name-error" class="mt-1 block text-xs font-normal text-red-700">{{ errores()['name'] }}</span> }
    </label>

    <div class="grid gap-4 sm:grid-cols-2">
      <app-campo-de-nit name="identificationNumber" identificador="nueva-org-identificationNumber" nombre="identificationNumber"
                        [(ngModel)]="formulario.identificationNumber" (ngModelChange)="limpiar('identificationNumber')"
                        [error]="errores()['identificationNumber'] ?? null" />

      <label for="nueva-org-contactEmail" class="block text-sm font-bold text-slate-900">
        Correo de contacto <span class="text-verde-texto" aria-hidden="true">*</span>
        <input id="nueva-org-contactEmail" name="contactEmail" type="email" required maxlength="320" autocomplete="email"
               [(ngModel)]="formulario.contactEmail" (ngModelChange)="limpiar('contactEmail')"
               [attr.aria-invalid]="errores()['contactEmail'] ? 'true' : null"
               [attr.aria-describedby]="errores()['contactEmail'] ? 'nueva-org-contactEmail-error' : 'nueva-org-contactEmail-ayuda'"
               class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-3 font-normal text-slate-900 focus:border-verde-medio focus:outline-none focus-visible:ring-2 focus-visible:ring-verde-medio">
        @if (errores()['contactEmail']) { <span id="nueva-org-contactEmail-error" class="mt-1 block text-xs font-normal text-red-700">{{ errores()['contactEmail'] }}</span> }
        @else { <span id="nueva-org-contactEmail-ayuda" class="mt-1 block text-xs font-normal text-prosa">Usa un correo de la organización, no el tuyo personal. No puede ser el de otra organización registrada.</span> }
      </label>
    </div>

    <fieldset class="grid gap-4 sm:grid-cols-2">
      <legend class="mb-2 text-sm font-bold text-slate-900">Sede</legend>
      <label for="nueva-org-headquartersDepartmentCode" class="block text-sm font-bold text-slate-900">
        Departamento <span class="text-verde-texto" aria-hidden="true">*</span>
        <select id="nueva-org-headquartersDepartmentCode" name="departamento" required
                [value]="departamento()" (change)="elegirDepartamento($any($event.target).value)"
                [attr.aria-invalid]="errores()['headquartersDepartmentCode'] ? 'true' : null"
                [attr.aria-describedby]="errores()['headquartersDepartmentCode'] ? 'nueva-org-departamento-error' : null"
                class="mt-1 w-full rounded-lg border border-slate-300 bg-white p-3 font-normal text-slate-900 focus:border-verde-medio focus:outline-none focus-visible:ring-2 focus-visible:ring-verde-medio">
          <option value="">Elige un departamento</option>
          @for (item of departamentos(); track item.codigo) { <option [value]="item.codigo">{{ item.nombre }}</option> }
        </select>
        @if (errores()['headquartersDepartmentCode']) { <span id="nueva-org-departamento-error" class="mt-1 block text-xs font-normal text-red-700">{{ errores()['headquartersDepartmentCode'] }}</span> }
      </label>

      <label for="nueva-org-headquartersMunicipalityCode" class="block text-sm font-bold text-slate-900">
        Municipio <span class="text-verde-texto" aria-hidden="true">*</span>
        <app-filtro-desplegable completo tamano="comodo" etiqueta="Municipio" idDelControl="nueva-org-headquartersMunicipalityCode" obligatorio name="municipio" required [deshabilitado]="!departamento()" [(ngModel)]="formulario.headquartersMunicipalityCode" (ngModelChange)="limpiar('headquartersMunicipalityCode')" [invalido]="!!(errores()['headquartersMunicipalityCode'])" [descritoPorExterno]="errores()['headquartersMunicipalityCode'] ? 'nueva-org-municipio-error' : null" [opciones]="municipios() | opcionesDesde:'municipalityCode':'municipalityName':(departamento() ? 'Elige un municipio' : 'Primero elige el departamento')" />
        @if (errores()['headquartersMunicipalityCode']) { <span id="nueva-org-municipio-error" class="mt-1 block text-xs font-normal text-red-700">{{ errores()['headquartersMunicipalityCode'] }}</span> }
      </label>
    </fieldset>

    <div class="flex flex-wrap items-center gap-3 pt-2">
      <app-boton importancia="principal" tipo="submit" identificador="nueva-org-registrar" [ocupado]="guardando()">Registrar la organización</app-boton>
      <a [routerLink]="rutas.organizaciones" class="inline-flex min-h-11 items-center rounded-lg px-4 text-sm font-bold text-slate-700 hover:text-morado hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-morado">Cancelar</a>
    </div>
  </form>
</section>
