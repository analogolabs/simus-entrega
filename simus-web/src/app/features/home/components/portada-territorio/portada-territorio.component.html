<!-- La música en el territorio: fondo claro, con el mapa en morados como protagonista. -->
<section id="portada-territorio" class="overflow-hidden bg-white py-20 lg:py-24">
  <div class="mx-auto grid max-w-7xl grid-cols-1 items-start gap-16 px-6 lg:grid-cols-12 lg:gap-8 lg:px-8">
    <div class="lg:col-span-5">
      <app-encabezado-de-seccion [antetitulo]="texto('home_banner2_tag')" [titulo]="texto('home_banner2_title')" [texto]="texto('home_banner2_desc')"></app-encabezado-de-seccion>

      <!-- Los números grandes no necesitan cajas: el número ya es el elemento gráfico. -->
      <dl class="mt-12 grid grid-cols-2 gap-x-10 gap-y-12 border-t border-filete pt-10">
        @for (cifra of cifras(); track cifra.rotulo; let i = $index) {
          <!-- Dato destacado: el número es el elemento gráfico. -->
          <div class="flex flex-col-reverse" [appRevelar]="i * 100">
            <dt class="tipo-etiqueta mt-3 text-tinta-media">{{ cifra.rotulo }}</dt>
            <dd class="tipo-cifra text-morado"><app-contador [valor]="cifra.valor"></app-contador></dd>
          </div>
        } @empty {
          @if (cargando()) {
            @for (n of [1, 2, 3, 4]; track n) {
              <div aria-hidden="true">
                <div class="h-16 w-24 animate-pulse rounded-lg bg-morado-100"></div>
                <div class="mt-3 h-3 w-32 animate-pulse rounded bg-morado-100"></div>
              </div>
            }
          }
        }
      </dl>

      <button
        type="button"
        (click)="explorarMapa()"
        class="tipo-enlace mt-12 inline-flex cursor-pointer items-center rounded-xl border-0 bg-verde px-7 py-4 text-morado-vivo transition-colors hover:bg-verde-claro focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-morado focus-visible:ring-offset-2"
      >
        {{ texto('home_banner2_cta') }}
      </button>
    </div>

    <!-- Colombia, departamento por departamento, teñida por sus registros publicados. -->
    <figure class="lg:col-span-7 lg:col-start-6 lg:self-center lg:pl-8" appRevelar revelarVariante="zoom">
      <button
        type="button"
        (click)="explorarMapa()"
        class="block w-full cursor-pointer border-0 bg-transparent p-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-morado focus-visible:ring-offset-4"
        aria-label="Abrir el mapa ecosistémico"
      >
        <svg [attr.viewBox]="'0 0 1000 ' + alto()" class="mx-auto h-auto w-full max-h-[86vh]" role="img" aria-label="Mapa de Colombia con los registros publicados por departamento">
          @for (dpto of departamentos(); track dpto.codigo) {
            <path [attr.d]="dpto.trazado" [attr.fill]="relleno(dpto.codigo)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" class="transition-opacity hover:opacity-80">
              <title>{{ dpto.nombre }}: {{ registros(dpto.codigo) }} registros</title>
            </path>
          }
        </svg>
      </button>
    </figure>
  </div>
</section>
